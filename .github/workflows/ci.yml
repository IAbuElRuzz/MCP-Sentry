name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m mcpsentry demo
      - run: python -m mcpsentry demo --features
  optional-integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[documents,documents-pdfminer,interop]'
      - run: python -m unittest discover -s tests -v
      - run: docker --context default build -f examples/Dockerfile.demo -t mcpsentry-demo:local .
      - run: python -m unittest discover -s tests -p test_optional_integrations.py -v
        env:
          MCP_SENTRY_RUN_DOCKER_TESTS: '1'
