[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-sentry"
version = "0.5.0"
description = "An MCP security gateway with outbound sensitive-data inspection, policies, and redacted audit events"
requires-python = ">=3.11"
dependencies = []
license = {text = "MIT"}

[project.optional-dependencies]
documents = ["pypdf>=5,<8"]
documents-pdfminer = ["pdfminer.six>=20260107"]
interop = ["mcp>=1.20,<2"]

[project.scripts]
mcpsentry = "mcpsentry.cli:main"

[tool.setuptools.packages.find]
include = ["mcpsentry*"]
