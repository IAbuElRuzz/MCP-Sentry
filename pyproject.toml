[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-sentry"
version = "0.1.0"
description = "A local MCP stdio security gateway with policies and redacted audit events"
requires-python = ">=3.11"
dependencies = []
license = {text = "MIT"}

[project.scripts]
mcpsentry = "mcpsentry.cli:main"

[tool.setuptools.packages.find]
include = ["mcpsentry*"]
